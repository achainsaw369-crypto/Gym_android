<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="theme-color" content="#ECEDEA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Журнал тренировок</title>
<style>
:root{
  --chalk:#ECEDEA; --paper:#FAFAF8; --ink:#17191B; --mute:#697075; --line:#D3D6D1;
  --iron:#D6322B;   /* силовые: красный диск 25 кг */
  --blue:#1F5FBF;   /* кардио: синий диск 20 кг */
  --gold:#E8A900;   /* рекорд */
  --field:#fff; --onink:#fff; --ph:#A3A8A5; --swoff:#CFC9BE; --tbar:#17191B;
  --warm-bg:#FFF4D6; --warm-ink:#6B4F00; --chip-bg:#FDE7E5; --chip-ink:#9C2019; --ok:#2E6B3B; --iron-soft:#E9B3B0;
  --num:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
}
html[data-theme=dark]{
  --chalk:#121416; --paper:#1C1F22; --ink:#E8EAEC; --mute:#9AA2A8; --line:#353A3F;
  --blue:#6A9BE8;
  --field:#25292D; --onink:#121416; --ph:#6E767C; --swoff:#4A5056; --tbar:#2A2F34;
  --warm-bg:#3A3220; --warm-ink:#F0D58A; --chip-bg:#4A2422; --chip-ink:#FFB4AE; --ok:#7BD08B; --iron-soft:#7A3A36;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--chalk);color:var(--ink);
  font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;right:0;top:0;display:flex;flex-direction:column}
#app{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(8px + env(safe-area-inset-top)) max(12px,calc((100vw - 560px)/2)) 28px}
body.kb nav{display:none}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mute{color:var(--mute);font-size:14px;margin:6px 0}

/* заголовки */
.date,.h1{font-family:var(--num);font-weight:800;font-size:34px;line-height:1.05;margin:4px 0 8px}
.date{font-size:30px;margin:2px 0 4px}
.date::first-letter{text-transform:uppercase}
.h1{margin-bottom:14px}
#totals{color:var(--mute);font-variant-numeric:tabular-nums;font-size:15px;min-height:22px}
.title{width:100%;border:0;border-bottom:1.5px dashed var(--line);background:transparent;padding:4px 0;margin:0 0 4px;font-size:17px}
.title:focus{outline:none;border-bottom-color:var(--ink)}
.back{border:0;background:none;color:var(--blue);font-weight:600;padding:8px 0;font-size:16px}

/* блок упражнения: цвет полосы = тип */
.ex{background:var(--paper);border-left:6px solid var(--iron);border-radius:0 12px 12px 0;padding:8px 10px 8px 12px;margin:10px 0}
.ex.c{border-left-color:var(--blue)}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.exhead h3{flex:1;min-width:0;font-family:var(--num);font-weight:800;font-size:19px;line-height:1.15;margin:0;letter-spacing:.01em}
.last{color:var(--mute);font-size:12px;margin:0 0 5px;font-variant-numeric:tabular-nums}
.pnote{display:flex;align-items:flex-start;gap:6px;margin:0 0 6px;font-size:13px;line-height:1.3;color:var(--warm-ink);background:var(--warm-bg);border-radius:6px;padding:3px 4px 3px 8px}
.pt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
.pnote.open .pt{display:block;-webkit-line-clamp:unset;overflow:visible}
.pbtn{display:none;flex:none;width:26px;height:20px;border:0;background:none;color:var(--warm-ink);font-size:14px;line-height:1;padding:0;place-items:center}
.pnote.ov{cursor:pointer}
.pnote.ov .pbtn{display:grid}
.pnote.open .pbtn{transform:rotate(180deg)}
.ico{width:34px;height:34px;border:0;background:none;color:var(--mute);font-size:21px;line-height:1;border-radius:8px;padding:0;display:grid;place-items:center}
.ico:active{background:var(--chalk)}

.sethead,.set{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:6px;align-items:center}
.sethead{color:var(--mute);font-size:11px;text-align:center;margin-bottom:2px}
.set.l,.sethead.l{grid-template-columns:24px 1fr 56px 1fr 34px}
.kgref{font-size:12px;line-height:1.1;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.set{margin:4px 0}
.n{width:24px;height:24px;display:grid;place-items:center;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.n.pr{background:var(--gold);color:#17191B;border-radius:50%;font-size:13px}
/* номер подхода + отдых перед ним */
.nc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:24px;min-height:36px}
.nc .n{height:22px;width:22px}
.rs{font-size:10px;line-height:1;color:var(--blue);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em;margin-top:1px}
/* секундомер отдыха в сегодняшней тренировке */
.tbar{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;align-items:center;gap:10px;margin:6px 0 4px;padding:6px 12px;
  background:var(--tbar);color:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(23,25,27,.18)}
.tbar div{display:flex;flex-direction:column;line-height:1.1}
.tbar small{font-size:11px;color:#B9BEC2;letter-spacing:.02em}
.tbar b{font-family:var(--num);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.tbar .tr{flex:1}
.tbar .td{text-align:right;align-items:flex-end}
.tbar .td b{font-size:18px;color:#DDE1E4}
.tbar .tc{flex-direction:row;align-items:center;gap:6px;flex:none}
.tb{border:0;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-weight:650;font-size:14px;height:36px;padding:0 8px;min-width:58px}
.tb.go{background:var(--iron)}
.tb:active{opacity:.75}
.tbar.paused #trest{color:#9EA5AA}
.btn.finish{margin-top:14px}
.donecard{background:var(--paper);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.donecard b{display:block;font-size:17px}
.donecard span{display:block;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.donecard .bn{display:flex;gap:8px}
.donecard .bn .btn{flex:1;margin:10px 0 0;padding:10px}
.fin{color:var(--mute);font-size:14px;margin:0 0 4px}
.set input,.cardio input{width:100%;height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);
  text-align:center;font-family:var(--num);font-weight:700;font-size:19px;padding:0;font-variant-numeric:tabular-nums}
.set input::placeholder,.cardio input::placeholder{font-weight:500;color:var(--ph)}
.set input:focus,.cardio input:focus{outline:none;border-color:var(--ink)}
.addset{width:100%;padding:7px;border:1.5px dashed var(--line);background:none;border-radius:8px;font-weight:600;font-size:14px;margin-top:4px}
.ex.s .addset{color:var(--iron);border-color:var(--iron-soft)}
.cmt{display:block;width:100%;min-height:36px;height:36px;margin-top:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);padding:7px 9px;font-size:16px;line-height:1.3;resize:none;overflow:hidden}
.cmt:focus{outline:none;border-color:var(--ink)}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardio label{font-size:12px;color:var(--mute);display:block}
.cardio input{margin-top:2px}
.pace{font-size:13px;color:var(--blue);font-weight:600;margin-top:5px;min-height:18px;font-variant-numeric:tabular-nums}

/* переключатель кг / lbs в шапке столбца веса */
.seg{display:inline-flex;flex:none;border:1.5px solid var(--ink);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 9px;min-width:38px;height:26px;font-weight:650;font-size:12px;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--onink)}

.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 14px}
.addrow .add{margin:0;padding:13px 6px}
.add.alt{border-style:dashed}
.stitle{flex:1;font-family:var(--num);font-weight:800;font-size:22px}
.tprow{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-bottom:1px solid var(--line)}
.tprow b{display:block;font-size:17px}
.tprow span{font-size:13px;color:var(--mute)}
.tpi{display:flex;align-items:center;gap:4px;background:var(--paper);border-left:6px solid var(--iron);border-radius:0 10px 10px 0;padding:6px 6px 6px 10px;margin:6px 0}
.tpi.c{border-left-color:var(--blue)}
.tpn{flex:1;min-width:0;line-height:1.2}
.tpn b{display:block;font-size:15px}
.tpn small{color:var(--mute);font-size:12px}
.step{display:flex;align-items:center;gap:2px;font-weight:700;font-variant-numeric:tabular-nums}
.step span{min-width:20px;text-align:center}
.ib2{width:30px;height:32px;border:0;border-radius:8px;background:var(--chalk);font-size:16px;color:var(--ink);padding:0}
.ib2:disabled{opacity:.3}
.add{width:100%;padding:15px;border:2px solid var(--ink);border-radius:12px;background:transparent;font-weight:700;margin:2px 0 14px}
textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);padding:10px;resize:vertical}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.foot label{font-size:14px;color:var(--mute)}
.foot input[type=date]{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--field)}

/* кнопки */
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--ink);color:var(--onink);font-weight:650;text-align:center;margin:8px 0}
.btn.big{background:var(--iron);color:#fff;font-family:var(--num);font-size:24px;padding:18px;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.danger{background:none;border:0;color:var(--iron);font-weight:600;padding:12px 0}
.start{margin:30px 0 16px}
.lead{font-family:var(--num);font-size:26px;font-weight:700;margin:0 0 14px}

/* история */
.month{font-family:var(--num);font-size:20px;font-weight:700;margin:22px 0 6px;color:var(--mute)}
.month::first-letter{text-transform:uppercase}
.hrow{display:flex;gap:14px;width:100%;text-align:left;border:0;background:var(--paper);border-radius:12px;padding:12px 14px;margin:0 0 8px}
.hd{width:46px;text-align:center;flex:none}
.hd b{display:block;font-family:var(--num);font-size:32px;line-height:1}
.hd span{font-size:12px;color:var(--mute)}
.hb{min-width:0;flex:1}
.hn{font-weight:650}
.hs{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:4px;margin-right:6px;vertical-align:middle}
.dots i{width:8px;height:8px;background:var(--iron);border-radius:2px}
.dots i.c{background:var(--blue)}

/* прогресс */
.week{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.week div{background:var(--paper);border-radius:12px;padding:10px 12px}
.week b{display:block;font-family:var(--num);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.week span{font-size:12px;color:var(--mute)}
.sel{width:100%;padding:12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:650;margin-bottom:12px}
.chart{background:var(--paper);border-radius:12px;padding:10px 8px 6px}
.chart svg{width:100%;height:auto;display:block}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.rec div{background:var(--paper);border-radius:12px;padding:10px 12px}
.rec b{display:block;font-family:var(--num);font-size:26px;font-variant-numeric:tabular-nums}
.rec span{font-size:12px;color:var(--mute)}
.sess{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.sess span:first-child{color:var(--mute);flex:none}
.sess span:last-child{text-align:right}
.sess small{display:block;color:var(--mute);font-size:12px;font-style:italic;white-space:pre-line}

/* ещё */
.box{background:var(--paper);border-radius:14px;padding:14px;margin:0 0 14px}
.box h2{font-family:var(--num);font-size:22px;margin:0 0 6px}
.exrow{display:flex;align-items:center;gap:10px;padding:2px 0;border-bottom:1px solid var(--line)}
.exrow span{flex:1;min-width:0}
.exrow i,.pick i{width:10px;height:10px;border-radius:2px;background:var(--iron);flex:none}
.exrow.c i,.pick.c i{background:var(--blue)}

/* нижняя панель */
nav{flex:none;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--mute);border-top:3px solid transparent;margin-top:-1px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);border-top-color:var(--iron);font-weight:650}

/* выбор упражнения: на весь видимый экран, поле поиска сверху — клавиатура его не закрывает */
#sheet{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:20;
  display:flex;flex-direction:column;background:var(--paper);animation:fade .15s ease-out}
@keyframes fade{from{opacity:.3}to{opacity:1}}
.sbar{flex:none;display:flex;gap:12px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
#q{flex:1;min-width:0;padding:12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--field)}
.sbar button{border:0;background:none;color:var(--blue);font-weight:600;padding:8px 0}
#plist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:13px 4px;border-bottom:1px solid var(--line);font-size:17px}
.createbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px dashed var(--iron);border-radius:12px;background:var(--field);color:var(--ink);padding:12px;margin:10px 0 4px;font-size:17px;font-weight:650}
.createbtn b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--iron);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.createbtn span{flex:1;min-width:0;overflow-wrap:anywhere}
.newex{padding:6px 0}
.newex .back{border:0;background:none;color:var(--iron);font-size:16px;font-weight:650;padding:8px 0}
.newex h3{font-family:var(--num);font-size:22px;margin:4px 0 2px}
.newex .nm{font-weight:650;font-size:17px;overflow-wrap:anywhere;margin:0 0 2px}
.chip{border:0;border-radius:20px;padding:9px 16px;color:#fff;font-weight:650}
.chip.s{background:var(--iron)} .chip.c{background:var(--blue)}

/* группы мышц, добавление за дату */
.grp{font-family:var(--num);font-size:18px;font-weight:700;color:var(--mute);margin:0;padding:12px 0 4px;position:sticky;top:0;background:var(--paper)}
.grp.static{position:static;background:none;padding-top:14px}
.gsel{border:1.5px solid var(--line);border-radius:8px;background:var(--field);padding:6px 4px;font-size:14px;max-width:104px}
.newdate{background:var(--paper);border-radius:12px;padding:12px;margin:0 0 14px}
.newdate label{display:block;font-size:13px;color:var(--mute)}
.newdate input{display:block;width:100%;min-width:0;max-width:100%;height:46px;margin-top:4px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);-webkit-appearance:none;appearance:none;text-align:left}
.newdate .btn{width:100%;margin:10px 0 0;padding:13px}
.gbars{background:var(--paper);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.sub{font-family:var(--num);font-size:18px;margin:0 0 6px}
.gb{display:grid;grid-template-columns:72px 1fr 28px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.gb div{height:10px;background:var(--chalk);border-radius:5px;overflow:hidden}
.gb i{display:block;height:100%;background:var(--iron)}
.gb b{text-align:right;font-variant-numeric:tabular-nums}

.rest{background:var(--paper);border-radius:10px;padding:8px 10px;margin:6px 0 4px}
.rest b{font-size:13px}
.rest .chips{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 3px}
.rest .chips span{background:var(--chip-bg);color:var(--chip-ink);border-radius:12px;padding:2px 10px;font-weight:650;font-size:14px}
.rest small{display:block;color:var(--mute);font-size:12px}
.rest.ok b{color:var(--ok)}
.thanks{background:var(--warm-bg);border:2px solid var(--gold);border-radius:14px;padding:14px;margin:0 0 10px;color:var(--warm-ink)}
.thanks .th{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:22px;font-weight:800;color:var(--ink);margin:0 0 4px}
.thanks p{margin:0 0 10px;font-size:15px;line-height:1.4}
.thanks p a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.thanks .tk{display:flex;gap:8px}
.thanks .tk .btn{flex:1;margin:0;padding:12px 8px;font-size:15px}
.thanks .btn.sup{background:var(--gold);color:#17191B;text-decoration:none}
.thanks .btn.ghost{border-color:var(--warm-ink);color:var(--warm-ink)}
.thanks .qrbox{margin-top:10px;text-align:center}
.thanks .qrbox[hidden]{display:none}
.sharebtn{margin:0 0 10px}
.sharebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.sharebox[hidden]{display:none}
.shq{margin:0;background:var(--paper);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center}
.shq figcaption{font-weight:700;font-size:14px;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.qrw{width:100%;max-width:170px;margin:6px 0 4px;background:#fff;border-radius:8px;overflow:hidden}
.qrw svg{display:block;width:100%;height:auto}
.lnk{border:0;background:none;color:var(--blue);font-weight:600;font-size:13px;padding:6px 4px}
#force{position:fixed;inset:0;z-index:100;background:var(--chalk);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
#force .fbox{width:100%;max-width:420px;text-align:center}
#force .fic{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--iron);color:#fff;display:grid;place-items:center;font-size:38px;line-height:1}
#force h2{font-family:var(--num);font-size:30px;line-height:1.1;margin:0 0 10px}
#force p{margin:0 0 16px;font-size:16px;line-height:1.45}
#force .mute{font-size:14px;margin:4px 0 14px}
.mail{font-size:14px;color:var(--mute);margin:0 0 10px;padding:0 2px}
.mail a{color:var(--blue);font-weight:650}
.appver{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:0 2px}
.appver span{color:var(--mute);font-size:14px;white-space:nowrap}
.appver .btn{width:auto;margin:0;padding:9px 14px;font-size:15px}
.navbox{padding:4px 14px}
.navrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;text-align:left}
.navrow:last-child{border-bottom:0}
.navrow span{flex:1}
.navrow small{color:var(--mute);font-weight:500;font-size:14px}
.navrow b{color:var(--mute);font-size:20px;font-weight:400}
.exbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;text-align:left;font-size:16px}
.exbtn i{width:10px;height:10px;border-radius:2px;background:var(--iron);flex:none}
.exbtn.c i{background:var(--blue)}
.exbtn span{flex:1;min-width:0}
.exbtn small{color:var(--mute);font-size:13px;white-space:nowrap}
.exbtn b{color:var(--mute);font-weight:400;font-size:18px}
.fl{display:block;font-size:13px;color:var(--mute);margin:14px 0 4px}
.fl input,.fl select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);font-size:17px;color:var(--ink)}
.mopt{display:flex;align-items:center;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 8px}
.mopt input{width:20px;height:20px;accent-color:var(--iron);flex:none;margin:0}
.mopt b{display:block;font-size:16px}
.mopt small{color:var(--mute);font-size:13px}
.mopt:has(input:checked){border-color:var(--iron)}
.grow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.grow input.gname{flex:1;min-width:0;border:1.5px solid transparent;border-radius:8px;background:transparent;padding:7px 8px;font-size:17px;font-weight:600;color:var(--ink)}
.grow input.gname:focus{outline:none;border-color:var(--line);background:var(--field)}
.grow input.gname:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.grow small{color:var(--mute);font-size:13px;white-space:nowrap}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.15;color:var(--mute);max-width:96px}
.chk input{width:20px;height:20px;accent-color:var(--iron);margin:0}
.gadd{display:flex;gap:8px;margin-top:12px}
.gadd input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
.gadd .btn{width:auto;margin:0;padding:11px 16px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.mchip{border:1.5px solid var(--line);border-radius:18px;background:var(--field);padding:7px 12px;font-size:14px;font-weight:600}
.mchip.on{border-color:var(--ink);background:var(--ink);color:var(--onink)}
.thanks .qrbox img{width:200px;height:200px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.sw,.swrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sw span,.swrow>span{flex:1;min-width:0}
.swrow[hidden]{display:none}
.sw input{-webkit-appearance:none;appearance:none;flex:none;width:48px;height:28px;border-radius:14px;background:var(--swoff);position:relative;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--iron)}
.sw input:checked::after{transform:translateX(20px)}
.backup{background:var(--warm-bg);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.backup b{font-family:var(--num);font-size:20px}
.backup p{margin:4px 0 0;font-size:14px}
.bn{display:flex;gap:8px}
.bn .btn{flex:1;margin:10px 0 0;padding:12px}

#toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--onink);
  padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const fmtN=n=>n==null?'':String(Math.round(n*100)/100).replace('.',',');
const fmtInt=n=>Math.round(n).toLocaleString('ru-RU');

/* ОБЯЗАТЕЛЬНОЕ ОБНОВЛЕНИЕ: версии ниже этой перестают работать и просят обновиться.

/* мышечные группы теперь хранятся в db.groups и редактируются пользователем; это список по умолчанию */
const DEFAULT_GROUPS=['Грудь','Спина','Ноги','Плечи','Бицепс','Трицепс','Пресс','Кардио','Другое'];
const NOHINT=['Кардио','Другое'];        // по умолчанию не участвуют в подсказке о не нагруженных группах
const FALLBACK='Другое';                 // сюда переходят упражнения удалённой группы; эту группу удалить нельзя
/* способ измерения подхода: wr — вес и повторы, wt — вес и время, dt — дистанция и время (одной записью) */
const MEAS={wr:'Вес и повторы',wt:'Вес и время',dt:'Дистанция и время'};
const MEAS_EX={wr:'Поля: кг и повторы',wt:'Поля: кг и секунды',dt:'Поля: км и минуты, темп считается сам'};
const MEAS_SHORT={wr:'вес × повторы',wt:'вес × время',dt:'дистанция, время'};
const SEED_M={'планка':'wt'};
const SEED=[

  ['Скручивания','s','Пресс'],['Подъём ног в висе','s','Пресс'],['Планка','s','Пресс'],
  ['Бег','c','Кардио'],['Велосипед','c','Кардио'],['Плавание','c','Кардио'],['Ходьба','c','Кардио'],['Гребной тренажёр','c','Кардио'],['Эллипс','c','Кардио']
];
const GROUP_OF={};SEED.forEach(([n,,g])=>GROUP_OF[n.toLowerCase()]=g);
const defGroups=()=>DEFAULT_GROUPS.map(n=>({name:n,hint:!NOHINT.includes(n)}));
const groupNames=()=>db.groups.map(g=>g.name);
const groupOf=e=>e&&db.groups.some(g=>g.name===e.group)?e.group:FALLBACK;
const typeOfM=m=>m==='dt'?'c':'s';
const fresh=()=>({v:4,groups:defGroups(),templates:[],exercises:SEED.map(([name,type,group])=>{const m=type==='c'?'dt':(SEED_M[name.toLowerCase()]||'wr');return{id:uid(),name,type:typeOfM(m),group,m}}),workouts:[],lastBackup:null});
let db=(()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.workouts)&&Array.isArray(j.exercises))return j}catch(e){}return fresh()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Не удалось сохранить: память браузера недоступна')}}
/* старые данные: проставить группы и один раз добавить новые упражнения из списка */
function migrate(){
  let ch=false;
  if(!Array.isArray(db.templates)){db.templates=[];ch=true}
  db.exercises.forEach(e=>{if(!e.group){e.group=e.type==='c'?'Кардио':(GROUP_OF[e.name.toLowerCase()]||'Другое');ch=true}});
  if((db.v||1)<2){
    SEED.forEach(([name,type,group])=>{if(!db.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase()))db.exercises.push({id:uid(),name,type,group})});
    db.v=2;ch=true;
  }
  if((db.v||1)<3){            // единицы веса переехали с тренировки на упражнение
    db.workouts.forEach(w=>{if(w.unit){w.entries.forEach(en=>{if(!en.unit)en.unit=w.unit});delete w.unit}});
    db.v=3;ch=true;
  }
  /* v4: свои мышечные группы и способ измерения у упражнения (проверяется всегда — в том числе после загрузки старой копии) */
  if(!Array.isArray(db.groups)){db.groups=defGroups();ch=true}
  if(!db.groups.some(g=>g.name===FALLBACK)){db.groups.push({name:FALLBACK,hint:false});ch=true}
  db.exercises.forEach(e=>{
    if(!e.m){e.m=e.type==='c'?'dt':'wr';ch=true}
    if(e.type!==typeOfM(e.m)){e.type=typeOfM(e.m);ch=true}
    if(!e.group){e.group=FALLBACK;ch=true}
    if(!db.groups.some(g=>g.name===e.group)){addGroup(e.group,true);ch=true}
  });
  if((db.v||1)<4){db.v=4;ch=true}
  if(ch)save();
}

/* новая группа встаёт перед «Кардио»/«Другое», чтобы служебные группы оставались внизу */
function addGroup(name,hint){
  const i=db.groups.findIndex(g=>NOHINT.includes(g.name));
  const g={name,hint:hint!==false};
  if(i<0)db.groups.push(g);else db.groups.splice(i,0,g);
  return g;
}
const exById=id=>db.exercises.find(e=>e.id===id);
const wById=id=>db.workouts.find(w=>w.id===id);
const exName=id=>exById(id)?.name||'Удалённое упражнение';
const exType=id=>exById(id)?.type||'s';
const exM=id=>exById(id)?.m||'wr';
/* подход выполнен: для «вес и повторы» есть повторы, для «вес и время» — время */
const sDone=(s,m)=>!!(s&&(m==='wt'?s.d:s.r));
const fmtSec=x=>{x=Math.round(x||0);const m=Math.floor(x/60);return m?`${m}:${pad(x%60)}`:`${x} с`};
const byDateDesc=()=>[...db.workouts].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);

/* ---------- расчёты ---------- */
/* ---------- время: отметки подходов ---------- */
const HOUR=36e5;
const clock=ms=>{const d=new Date(ms);return `${d.getHours()}:${pad(d.getMinutes())}`};
const fmtClock=ms=>{let x=Math.max(0,Math.floor(ms/1000));const h=Math.floor(x/3600);x-=h*3600;const m=Math.floor(x/60);x-=m*60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
const fmtDur=ms=>{const m=Math.round(ms/6e4);if(m<1)return '<1 мин';const h=Math.floor(m/60);return h?`${h} ч ${pad(m%60)} мин`:`${m} мин`};
/* отметки времени выполненных подходов (силовые — подход с повторами, кардио — заполненное упражнение), по возрастанию */
function stamps(w){
  const a=[];
  for(const en of w.entries){
    if(exType(en.ex)==='s'){const m=exM(en.ex);for(const s of en.sets||[])if(sDone(s,m)&&s.t)a.push(s.t)}
    else if(en.t&&(en.km||en.min))a.push(en.t);
  }
  return a.sort((x,y)=>x-y);
}
/* время тренировки: от начала до последнего подхода */
function workDur(w){
  const a=stamps(w);if(!a.length||!w.created)return 0;
  const d=a[a.length-1]-w.created;
  return d>0&&d<12*HOUR?d:0;
}
/* отдых перед подходом: от предыдущего выполненного подхода в этой тренировке */
function restBefore(w,t){
  let p=0;for(const x of stamps(w)){if(x<t)p=x;else break}
  return p?t-p:0;
}
/* отметить время, когда подход впервые заполнен (только в сегодняшней тренировке и при включённой настройке) */
function stamp(w,o,filled){
  if(!filled||!o||o.t||!w||w.finished||!cfg().timer||w.date!==todayStr())return false;
  o.t=Date.now();
  w.rt={acc:0,base:o.t,run:true};       // после каждого подхода секундомер отдыха начинает с нуля
  return true;
}
const restLabel=(w,s,m)=>{if(!cfg().timer||!sDone(s,m||'wr')||!s.t)return '';const r=restBefore(w,s.t);return r?fmtClock(r):''};
/* секундомер отдыха: {ms, run}; w.rt = {acc — накоплено, base — когда запущен, run — идёт ли} */
function restState(w){
  if(w.rt){const r=w.rt;return{ms:Math.max(0,r.acc+(r.run?Date.now()-r.base:0)),run:!!r.run}}
  const a=stamps(w);
  return a.length?{ms:Date.now()-a[a.length-1],run:true}:{ms:0,run:false};
}
const restText=st=>st.run&&st.ms>=3*HOUR?'—':fmtClock(st.ms);
function timerBarHTML(w){
  if(!cfg().timer||w.finished||w.date!==todayStr())return '';
  const st=restState(w);
  return `<div class="tbar${!st.run&&st.ms?' paused':''}" id="tbar">${timerBarInner(w)}</div>`;
}
function timerBarInner(w){
  const st=restState(w),d=workDur(w);
  return `<div class="tr"><small>${!st.run&&st.ms?'Пауза':'Отдых'}</small><b id="trest">${restText(st)}</b></div>
    <div class="tc"><button class="tb${st.run?'':' go'}" data-a="ttoggle">${st.run?'Стоп':'Старт'}</button><button class="tb" data-a="treset">Сброс</button></div>
    <div class="td"><small>Тренировка</small><b id="tdur">${d?fmtDur(d):'—'}</b></div>`;
}
function updTimer(full){
  const el=$('#tbar');if(!el)return;
  const w=curId&&wById(curId);if(!w)return;
  const st=restState(w);
  el.classList.toggle('paused',!st.run&&st.ms>0);
  const tr=$('#trest',el);
  if(full||!tr){el.innerHTML=timerBarInner(w);return}
  tr.textContent=restText(st);
}
setInterval(()=>{if($('#tbar')&&document.visibilityState==='visible')updTimer(false)},1000);
/* управление секундомером вручную */
function timerCmd(w,cmd){
  const st=restState(w),now=Date.now();
  if(cmd==='toggle')w.rt=st.run?{acc:st.ms,base:now,run:false}:{acc:st.ms,base:now,run:true};
  else if(cmd==='reset')w.rt={acc:0,base:now,run:st.run};
  save();updTimer(true);
}

function totals(w){
  const t={sets:0,vol:0,km:0,min:0,dur:cfg().timer?workDur(w):0};
  for(const en of w.entries){
    if(exType(en.ex)==='s'){const m=exM(en.ex);for(const s of en.sets||[]){if(sDone(s,m)){t.sets++;if(m==='wr')t.vol+=(s.w||0)*s.r}}}
    else{t.km+=en.km||0;t.min+=en.min||0}
  }
  return t;
}
function totalsText(t){
  const p=[];
  if(t.sets)p.push(`${t.sets} подх.`);
  if(t.vol)p.push(`${fmtInt(t.vol)} кг`);
  if(t.km)p.push(`${fmtN(t.km)} км`);
  if(t.min)p.push(`${fmtN(t.min)} мин`);
  if(t.dur)p.push(`время ${fmtDur(t.dur)}`);
  return p.join(', ')||'пока пусто';
}
function paceText(en){
  if(!en.km||!en.min)return '';
  const p=en.min/en.km;let m=Math.floor(p),s=Math.round((p-m)*60);
  if(s===60){m++;s=0}
  return `${m}:${pad(s)} мин/км, ${fmtN(en.km/(en.min/60))} км/ч`;
}
const setTxt=(s,m,u)=>m==='wt'?(s.w?`${fmtW(s.w,u)}×${fmtSec(s.d)}`:fmtSec(s.d)):`${fmtW(s.w||0,u)}×${s.r}`;
const setsText=en=>{const m=exM(en.ex);return (en.sets||[]).filter(s=>sDone(s,m)).map(s=>setTxt(s,m,'kg')).join(', ')};
const cardioText=en=>[en.km?`${fmtN(en.km)} км`:'',en.min?`${fmtN(en.min)} мин`:''].filter(Boolean).join(' за ');
const LB=2.2046226218;                                   // фунтов в килограмме; в базе вес всегда хранится в кг
const unitOf=(en,w)=>((en&&en.unit)||(w&&w.unit))==='lb'?'lb':'kg';   // единица ввода у упражнения; w.unit только для старых копий
const kgRef=kg=>kg?fmtN(Math.round(kg*10)/10)+' кг':'';
const uLabel=u=>u==='lb'?'lbs':'кг';
const toDisp=(kg,u)=>kg==null?null:(u==='lb'?kg*LB:kg);
const fromDisp=(v,u)=>v==null?null:(u==='lb'?v/LB:v);
const fmtW=(kg,u)=>kg==null?'':(u==='lb'?fmtN(Math.round(kg*LB*10)/10):fmtN(kg));
const setsTextU=(en,u)=>{const m=exM(en.ex),ds=(en.sets||[]).filter(s=>sDone(s,m));return ds.map(s=>setTxt(s,m,u)).join(', ')+(m==='wr'||ds.some(s=>s.w>0)?' '+uLabel(u):'')};
const hasData=en=>exType(en.ex)==='s'?(en.sets||[]).some(s=>sDone(s,exM(en.ex))):!!(en.km||en.min);

function lastTime(exId,w){
  for(const x of byDateDesc()){
    if(x.id===w.id||x.date>w.date)continue;
    const en=x.entries.find(e=>e.ex===exId&&hasData(e));
    if(en)return{date:x.date,en};
  }
  return null;
}
function lastNote(exId,w){
  for(const x of byDateDesc()){
    if(x.id===w.id||x.date>w.date)continue;
    const en=x.entries.find(e=>e.ex===exId&&e.note&&e.note.trim());
    if(en)return{date:x.date,text:en.note.trim()};
  }
  return null;
}
function prevMaxW(exId,w){
  let m=0;
  for(const x of db.workouts){
    if(x.id===w.id||x.date>=w.date)continue;
    for(const en of x.entries)if(en.ex===exId)for(const s of en.sets||[])if(s.r&&s.w>m)m=s.w;   // рекорды — только для «вес и повторы»
  }
  return m;
}
function isPR(w,en,j){
  const s=en.sets[j];
  if(exM(en.ex)!=='wr'||!s||!s.r||!(s.w>0))return false;
  const top=Math.max(...en.sets.map(t=>t.r?(t.w||0):0));
  if(s.w!==top)return false;
  if(en.sets.findIndex(t=>t.r&&t.w===s.w)!==j)return false;
  const prev=prevMaxW(en.ex,w);
  return prev>0&&s.w>prev;
}

let pickNew=false,tab='today',editing=null,curId=null,progEx=null,pickQ='',tplEditing=null,sheetMode='workout';

/* ---------- шаблоны ---------- */
function entryHTML(w,en,i){
  const type=exType(en.ex),u=unitOf(en,w),lb=u==='lb';
  const l=lastTime(en.ex,w);
  const exo=exById(en.ex),grp=exo?groupOf(exo)+'. ':'';
  const lastLine=grp+(l?`Прошлый раз, ${fmtMid(l.date)}: ${type==='s'?setsTextU(l.en,u):cardioText(l.en)}`:'Раньше не выполнялось');
  const pn=lastNote(en.ex,w);
  const seg=type==='s'?`<div class="seg" role="group" aria-label="Единицы веса"><button data-a="unit" data-u="kg" class="${lb?'':'on'}" aria-pressed="${!lb}">кг</button><button data-a="unit" data-u="lb" class="${lb?'on':''}" aria-pressed="${lb}">lbs</button></div>`:'';
  let body;
  if(type==='s'){
    const m=exM(en.ex),wt=m==='wt';
    const rows=(en.sets||[]).map((s,j)=>{
      const pr=isPR(w,en,j);
      return `<div class="set${lb?' l':''}" data-s="${j}">
        <span class="nc"><span class="n${pr?' pr':''}"${pr?' aria-label="рекорд"':''}>${pr?'★':j+1}</span>${(rl=>rl?`<small class="rs" aria-label="отдых перед подходом ${rl}">${rl}</small>`:'')(restLabel(w,s,m))}</span>
        <input inputmode="decimal" data-f="w" placeholder="0" value="${fmtN(toDisp(s.w,u))}" aria-label="Вес, ${uLabel(u)}">
        ${lb?`<span class="kgref">${kgRef(s.w)}</span>`:''}
        ${wt?`<input inputmode="numeric" data-f="d" placeholder="0" value="${s.d??''}" aria-label="Время, секунд">`:`<input inputmode="numeric" data-f="r" placeholder="0" value="${s.r??''}" aria-label="Повторы">`}
        <button class="ico" data-a="delset" aria-label="Убрать подход">−</button></div>`;
    }).join('');
    body=`<div class="sethead${lb?' l':''}"><span></span><span>${uLabel(u)}</span>${lb?'<span>≈ кг</span>':''}<span>${wt?'сек':'повторы'}</span><span></span></div>${rows}
      <button class="addset" data-a="addset">+ Подход</button>`;
  }else{
    body=`<div class="cardio">
      <label>Дистанция, км<input inputmode="decimal" data-f="km" placeholder="0" value="${fmtN(en.km)}"></label>
      <label>Время, мин<input inputmode="decimal" data-f="min" placeholder="0" value="${fmtN(en.min)}"></label></div>
      <div class="pace">${paceText(en)}</div>`;
  }
  const prev=pn?`<div class="pnote" data-a="pnote"><div class="pt"><b>${fmtMid(pn.date)}:</b> ${esc(pn.text)}</div><button class="pbtn" data-a="pnote" aria-label="Предыдущий комментарий полностью">▾</button></div>`:'';
  const cmt=`<textarea class="cmt" rows="1" data-f="enote" placeholder="Заметка к упражнению" aria-label="Заметка к упражнению">${esc(en.note||'')}</textarea>`;
  return `<section class="ex ${type}" data-e="${i}">
    <div class="exhead"><h3>${esc(exName(en.ex))}</h3>${seg}<button class="ico" data-a="delex" aria-label="Убрать упражнение">×</button></div>
    <p class="last">${esc(lastLine)}</p>${prev}${body}${cmt}</section>`;
}
function editorHTML(w,canBack){
  curId=w.id;
  return `${canBack?'<button class="back" data-a="back">‹ История</button>':''}
    <div class="date">${fmtLong(w.date)}</div>
    <input class="title" data-f="name" placeholder="Название, например «Грудь и спина»" value="${esc(w.name)}">
    <div id="totals">${totalsText(totals(w))}</div>
    ${w.finished?`<p class="fin">Завершена в ${clock(w.finished)}</p>`:''}
    ${timerBarHTML(w)}
    ${tab==='today'?restHTML(w):''}
    ${w.entries.map((en,i)=>entryHTML(w,en,i)).join('')}
    <div class="addrow"><button class="add" data-a="addex">+ Упражнение</button><button class="add alt" data-a="tplsheet">Из шаблона</button></div>
    <textarea data-f="note" placeholder="Заметка к тренировке: самочувствие, сон, что поменять в следующий раз">${esc(w.note)}</textarea>
    ${w.date===todayStr()?(w.finished?'<button class="btn finish" data-a="resume" data-id="'+w.id+'">Продолжить тренировку</button>':'<button class="btn finish" data-a="finish">✓ Завершить тренировку</button>'):''}

function restInfo(w){
  const ref=w?w.date:todayStr();
  const before=x=>w?(x.date<ref||(x.date===ref&&x.created<w.created)):x.date<=ref;
  const prev=byDateDesc().filter(x=>(!w||x.id!==w.id)&&before(x)&&x.entries.some(e=>exById(e.ex)&&hasData(e))).slice(0,cfg().restCount);
  if(!prev.length)return null;
  const loaded=new Set();
  prev.forEach(x=>x.entries.forEach(e=>{const ex=exById(e.ex);if(ex&&hasData(e))loaded.add(groupOf(ex))}));
  return{dates:prev.map(x=>x.date),missing:hintGroups().filter(g=>!loaded.has(g))};
}

function chartSVG(pts,color,unit){
  const W=320,H=170,L=38,R=12,T=14,B=26;
  let min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v));
  if(min===max){max+=1;min=Math.max(0,min-1)}else{const d=(max-min)*.2;min=Math.max(0,min-d);max+=d}
  const X=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let g='';
  for(let k=0;k<=2;k++){
    const v=min+(max-min)*k/2;
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/>
        <text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--mute)">${fmtN(Math.round(v*10)/10)}</text>`;
  }
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.v)}`).join('');
  let rec=pts[0].v;
  const dots=pts.map((p,i)=>{
    const isRec=i>0&&p.v>rec;if(isRec)rec=p.v;
    return `<circle cx="${X(i)}" cy="${Y(p.v)}" r="${isRec?5.5:3.5}" fill="${isRec?'#E8A900':color}" style="stroke:var(--paper)" stroke-width="1.5"/>`;
  }).join('');
  const lab=(i,anchor)=>`<text x="${X(i)}" y="${H-6}" text-anchor="${anchor}" font-size="11" style="fill:var(--mute)">${fmtMid(pts[i].d)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График: ${unit}">${g}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    ${lab(0,'start')}${pts.length>1?lab(pts.length-1,'end'):''}</svg>`;
}
function progressHTML(){
  const from=new Date();from.setDate(from.getDate()-6);
  const fs=toStr(from);
  const wk=db.workouts.filter(w=>w.date>=fs);
  let vol=0,km=0;wk.forEach(w=>{const t=totals(w);vol+=t.vol;km+=t.km});
  let html=`<h1 class="h1">Прогресс</h1>
    <div class="week"><div><b>${wk.length}</b><span>тренировок за 7 дней</span></div>
    <div><b>${fmtInt(vol)}</b><span>кг тоннаж</span></div>
    <div><b>${fmtN(km)}</b><span>км кардио</span></div></div>`;
  const gs={};
  wk.forEach(w=>w.entries.forEach(en=>{const ex=exById(en.ex);if(!ex||ex.type!=='s')return;const n=(en.sets||[]).filter(x=>sDone(x,ex.m)).length;if(n)gs[groupOf(ex)]=(gs[groupOf(ex)]||0)+n}));
  const gmax=Math.max(0,...Object.values(gs));
  if(gmax)html+=`<div class="gbars"><h2 class="sub">Подходы по группам за 7 дней</h2>${groupNames().filter(g=>gs[g]).map(g=>`<div class="gb"><span>${g}</span><div><i style="width:${gs[g]/gmax*100}%"></i></div><b>${gs[g]}</b></div>`).join('')}</div>`;
  const cnt={};
  db.workouts.forEach(w=>w.entries.forEach(en=>{if(hasData(en))cnt[en.ex]=(cnt[en.ex]||0)+1}));
  const ids=Object.keys(cnt).filter(id=>exById(id)).sort((a,b)=>cnt[b]-cnt[a]);
  if(!ids.length)return html+'<p class="mute">Когда внесёшь первые подходы или пробежки, здесь появятся графики и рекорды по каждому упражнению.</p>';
  if(!ids.includes(progEx))progEx=ids[0];
  const type=exType(progEx);
  const sess=[...db.workouts].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)
    .map(w=>({w,en:w.entries.find(e=>e.ex===progEx&&hasData(e))})).filter(x=>x.en);
  const opts=groupNames().map(g=>{
    const it=ids.filter(id=>groupOf(exById(id))===g).sort((a,b)=>exName(a).localeCompare(exName(b),'ru'));
    return it.length?`<optgroup label="${g}">${it.map(id=>`<option value="${id}"${id===progEx?' selected':''}>${esc(exName(id))}</option>`).join('')}</optgroup>`:'';
  }).join('');
  html+=`<select class="sel" id="progsel" aria-label="Упражнение">${opts}</select>`;
  let pts,unit,recs;
  const pm=exM(progEx);
  if(pm==='wt'){
    const dn=x=>x.en.sets.filter(s=>s.d);
    const useW=sess.some(x=>dn(x).some(s=>s.w>0));
    unit=useW?'лучший вес, кг':'лучшее время, сек';
    pts=sess.map(x=>({d:x.w.date,v:useW?Math.max(...dn(x).map(s=>s.w||0)):Math.max(...dn(x).map(s=>s.d))}));
    let bd=0,bw=0;sess.forEach(x=>dn(x).forEach(s=>{bd=Math.max(bd,s.d);bw=Math.max(bw,s.w||0)}));
    recs=[[fmtSec(bd),'рекорд по времени'],useW?[fmtN(bw),'лучший вес, кг']:[String(sess.length),'тренировок']];
  }else if(type==='s'){
    const useW=sess.some(x=>x.en.sets.some(s=>s.r&&s.w>0));
    unit=useW?'лучший вес, кг':'максимум повторов';
    pts=sess.map(x=>({d:x.w.date,v:useW?Math.max(...x.en.sets.map(s=>s.r?(s.w||0):0)):Math.max(...x.en.sets.map(s=>s.r||0))}));
    let bw=0,br=0,e1=0;
    sess.forEach(x=>x.en.sets.forEach(s=>{if(!s.r)return;const w=s.w||0;if(w>bw||(w===bw&&s.r>br)){bw=w;br=s.r}if(w>0)e1=Math.max(e1,w*(1+s.r/30))}));
    recs=useW?[[`${fmtN(bw)}×${br}`,'рекордный подход, кг×повторы'],[fmtInt(e1),'расчётный максимум на 1 повтор, кг']]
             :[[String(br),'рекорд по повторам'],[String(sess.length),'тренировок']];
  }else{
    const useKm=sess.some(x=>x.en.km>0);
    unit=useKm?'дистанция, км':'время, мин';
    pts=sess.map(x=>({d:x.w.date,v:useKm?(x.en.km||0):(x.en.min||0)}));
    let bp=null;sess.forEach(x=>{if(x.en.km&&x.en.min){const p=x.en.min/x.en.km;if(bp==null||p<bp)bp=p}});
    const bpT=bp==null?'—':`${Math.floor(bp)}:${pad(Math.round((bp-Math.floor(bp))*60)%60)}`;
    recs=[[fmtN(Math.max(...pts.map(p=>p.v))),useKm?'самая длинная, км':'самая долгая, мин'],[bpT,'лучший темп, мин/км']];
  }
  pts=pts.slice(-20);
  html+=`<div class="chart">${chartSVG(pts,type==='s'?'#D6322B':'#1F5FBF',unit)}</div>
    <p class="mute">${esc(unit)}. Золотые точки — новые рекорды.</p>
    <div class="rec">${recs.map(r=>`<div><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>`;
  html+=sess.slice(-6).reverse().map(x=>`<div class="sess"><span>${fmtMid(x.w.date)}</span><span>${type==='s'?setsText(x.en):cardioText(x.en)+(paceText(x.en)?', '+paceText(x.en).split(',')[0]:'')}${x.en.note&&x.en.note.trim()?`<small>${esc(x.en.note.trim())}</small>`:''}</span></div>`).join('');
  return html;
}

async function exportData(){
  const name=`zhurnal-${todayStr()}.json`;
  if(IS_NATIVE){
    try{
      const r=await NP.Filesystem.writeFile({path:name,data:JSON.stringify(db,null,1),directory:'CACHE',encoding:'utf8'});
      await NP.Share.share({title:'Журнал тренировок',url:r.uri,dialogTitle:'Сохранить копию'});
      db.lastBackup=Date.now();save();render();return;
    }catch(e){
      if(/cancel/i.test(String(e&&(e.message||e))))return;
      try{await navigator.clipboard.writeText(JSON.stringify(db));db.lastBackup=Date.now();save();render();toast('Копия скопирована в буфер: вставь её в заметки или сообщение себе');return}catch(e2){}
      toast('Не удалось сохранить копию');return;
    }
  }
  const file=new File([JSON.stringify(db,null,1)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Журнал тренировок'});
      db.lastBackup=Date.now();save();render();return;
    }
  }catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  db.lastBackup=Date.now();save();render();
}

/* Android: новые версии APK берём из GitHub Releases */
async function fetchLatestApk(){
  if(!GH_REPO)throw new Error('norepo');
  const r=await fetch(`https://api.github.com/repos/${GH_REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json(),a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
  if(!a)throw new Error('noapk');
  return{ver:String(j.tag_name||'').replace(/^v/i,''),url:a.browser_download_url};
}

    <button class="btn" data-a="apkdl">Скачать версию ${esc(u.ver)}</button>`:'';
}

  if(!auto)toast('Проверяю…');
  try{
    const u=await fetchLatestApk();
    localStorage.setItem('zhurnal.apk',JSON.stringify(u));
    if(isNewer(u.ver,VERSION)){
      if(auto){toast(`Вышла версия ${u.ver}: «Настройки» → Проверить обновление`);return}
      if(tab==='more')render();
      if(confirm(`Доступна версия ${u.ver} (у тебя ${VERSION}). Скачать?`))openExternal(u.url);
    }else if(!auto)toast(`Установлена последняя версия ${VERSION}`);
  }catch(e){
    if(!auto)toast(GH_REPO?'Не удалось проверить: нет связи или релиз ещё не создан':'Адрес репозитория не задан при сборке');
  }
}

    const last=+localStorage.getItem('zhurnal.apkchk')||0;

const FORCE_KEY='zhurnal.force';
/* откуда читать опубликованную версию: веб — свой же index.html, Android — сайт на GitHub Pages, запасной путь — файл в репозитории */
const remoteIndexURLs=()=>IS_NATIVE?[SHARE_WEB+'index.html',`https://raw.githubusercontent.com/${GH_REPO||SHARE_REPO}/HEAD/index.html`]:['index.html'];
async function fetchRemoteMeta(){
  for(const u of remoteIndexURLs()){
    try{
      const r=await fetch(u+'?'+Date.now(),{cache:'no-store'});if(!r.ok)continue;
      const t=await r.text();
      const v=(t.match(/const VERSION='([^']+)'/)||[])[1],m=(t.match(/const MIN_VERSION='([^']+)'/)||[])[1];
      if(v)return{ver:v,min:m||'0'};
    }catch(e){}
  }
  return null;
}
function getForce(){try{const f=JSON.parse(localStorage.getItem(FORCE_KEY)||'null');return f&&f.min&&isNewer(f.min,VERSION)?f:null}catch(e){return null}}

  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();

  if(!el){el=document.createElement('div');el.id='force';el.setAttribute('role','alertdialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby','fh');document.body.appendChild(el)}
  el.innerHTML=`<div class="fbox"><div class="fic" aria-hidden="true">⟳</div>

    <p>Вышла версия ${esc(f.ver)} с важными изменениями. Твоя версия ${VERSION} больше не поддерживается. Обнови приложение, чтобы продолжить: все тренировки сохранятся.</p>
    <button class="btn big" data-a="forceupd">${IS_NATIVE?'Скачать версию '+esc(f.ver):'Обновить'}</button>

    <button class="btn ghost" data-a="export">Сохранить копию данных</button></div>`;
}
let forceBusy=false,forceLast=0;
async function checkForced(){
  if(forceBusy)return;forceBusy=true;forceLast=Date.now();
  try{
    const r=await fetchRemoteMeta();if(!r)return;            // нет связи — решение не меняем
    const min=isNewer(r.min,r.ver)?'0':r.min;                // защита от ошибки: минимальная версия выше опубликованной — не блокируем
    if(!isNewer(min,VERSION)){clearForce();return}
    let f={min,ver:r.ver};
    if(IS_NATIVE){
      const apk=await fetchLatestApk().catch(()=>null);
      if(!apk||isNewer(min,apk.ver))return;                  // APK нужной версии ещё не собран — пока не блокируем
      f={min,ver:apk.ver,url:apk.url};
    }
    showForce(f);
  }finally{forceBusy=false}
}
async function checkUpdate(){
  if(IS_NATIVE)return checkUpdateNative(false);
  toast('Проверяю…');
  try{
    const r=await fetch('index.html?'+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/const VERSION='([^']+)'/);
    const remote=m&&m[1];
    if(remote&&remote!==VERSION){toast(`Найдена версия ${remote}, обновляю…`);setTimeout(hardReload,900);return}
    toast(remote?`Установлена последняя версия ${VERSION}`:'Не удалось прочитать версию на сервере');
  }catch(e){toast('Нет связи с сервером')}
}
function importFile(f){
  if(!f)return;
  f.text().then(t=>{
    try{
      const j=JSON.parse(t);
      if(!Array.isArray(j.workouts)||!Array.isArray(j.exercises))throw 0;
      const map={};
      j.exercises.forEach(e=>{
        const ex=db.exercises.find(x=>x.id===e.id)||db.exercises.find(x=>x.name.toLowerCase()===e.name.toLowerCase()&&x.type===e.type);
        if(ex)map[e.id]=ex.id;else{db.exercises.push(e);map[e.id]=e.id}
      });
      const ids=new Set(db.workouts.map(w=>w.id));let n=0;
      j.workouts.forEach(w=>{if(ids.has(w.id))return;w.entries.forEach(en=>en.ex=map[en.ex]||en.ex);db.workouts.push(w);n++});
      (j.groups||[]).forEach(g=>{if(g&&g.name&&!db.groups.some(x=>x.name.toLowerCase()===String(g.name).toLowerCase()))addGroup(String(g.name),g.hint!==false)});
      (j.templates||[]).forEach(tp=>{if(db.templates.some(x=>x.id===tp.id))return;tp.items.forEach(it=>it.ex=map[it.ex]||it.ex);db.templates.push(tp)});
      migrate();save();render();toast(`Добавлено тренировок: ${n}`);
    }catch(e){toast('Это не файл копии журнала')}
  });
}

  t.textContent=m;requestAnimationFrame(()=>t.classList.add('on'));
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);
}

  document.body.style.height=h+'px';document.body.style.top=t+'px';
  document.body.classList.toggle('kb',h<window.innerHeight-120);

}

    NP.App.minimizeApp?NP.App.minimizeApp():NP.App.exitApp();
  })}catch(e){}
  /* ссылки наружу открываем в браузере телефона */
  document.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="http"]');
    if(a){e.preventDefault();openExternal(a.href)}
  });
  setTimeout(autoCheckNative,4000);
}
</script>
</body>
</html>
